<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Client</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 600px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .input-group {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        input[type="text"] {
            flex: 1;
            padding: 0.5rem;
            font-size: 1rem;
        }

        button {
            padding: 0.5rem 1rem;
            font-size: 1rem;
            cursor: pointer;
        }

        #messages {
            border: 1px solid #ccc;
            padding: 1rem;
            height: 300px;
            overflow-y: auto;
            background: #f9f9f9;
        }

        .message {
            margin: 0.5rem 0;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
        }

        .sent {
            background-color: #e3f2fd;
            text-align: right;
        }

        .received {
            background-color: #f5f5f5;
        }
    </style>
</head>

<body>
    <h1>WebSocket Server</h1>

    <div class="input-group">
        <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
        <button id="send-button">Send</button>
    </div>

    <div id="messages"></div>

    <script>
        const connection = new WebSocket('ws://localhost:3000');
        const messagesDiv = document.getElementById('messages');
        const messageInput = document.getElementById('message-input');
        const sendButton = document.getElementById('send-button');

        function appendMessage(text, type) {
            const msgEl = document.createElement('div');
            msgEl.classList.add('message', type);
            msgEl.textContent = text;
            messagesDiv.appendChild(msgEl);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        connection.onopen = () => {
            appendMessage('Connected to server', 'received');
        };

        connection.onmessage = (event) => {
            appendMessage(`Server: ${event.data}`, 'received');
        };

        connection.onclose = () => {
            appendMessage('Disconnected from server', 'received');
        };

        function sendMessage() {
            const message = messageInput.value.trim();
            if (message && connection.readyState === WebSocket.OPEN) {
                connection.send(message);
                appendMessage(`You: ${message}`, 'sent');
                messageInput.value = '';
            }
        }

        sendButton.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>

</html>
